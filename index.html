<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile App Branding -->
    <title>AIIS Mobile - Eswatini Agriculture</title>
    <meta name="description" content="National Agriculture Integrated Information System Mobile App">
    <link rel="icon" href="https://www.agrinfosystems.gov.sz/assets/uploads/favicon1.png" type="image/png">
    
    <!-- iOS Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AIIS Mobile">
    <link rel="apple-touch-icon" href="https://www.agrinfosystems.gov.sz/assets/uploads/favicon1.png">
    
    <!-- Android / PWA -->
    <meta name="theme-color" content="#1B4D3E">
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }

      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none; /* Prevent rubber-banding on mobile */
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Custom scrollbars for native look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }

      .safe-pt { padding-top: var(--sat); }
      .safe-pb { padding-bottom: var(--sab); }
      
      /* Smooth transitions for mobile panels */
      .mobile-panel-shadow {
        box-shadow: 0 -10px 30px -5px rgba(0, 0, 0, 0.15);
      }

      /* No-selection for UI elements to feel native */
      .no-select {
        -webkit-user-select: none;
        user-select: none;
      }
      
      input, textarea {
        font-size: 16px !important; /* Prevents iOS auto-zoom on focus */
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom,redux",
    "@google/genai": "https://esm.sh/@google/genai@1.30.0",
    "redux": "https://esm.sh/redux@4.2.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.0"
  }
}
</script>
  </head>
  <body class="bg-gray-50 text-slate-800 antialiased">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
